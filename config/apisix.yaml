# Frank!Gateway (APISIX) routing config -> mounted at /usr/local/apisix/conf/apisix.yaml
#
# LOCAL TEST VERSION of a partner integration config. Everything that reached
# outside this machine is replaced by a local equivalent; the point of what is left
# is to exercise the observability stack - loki-logger -> Loki and prometheus ->
# Prometheus - not the integrations themselves.
#
# Dropped from the production config, and why:
#
#   ssls:           the server cert and key came from ${{GATEWAY_CERT}} /
#                   ${{GATEWAY_KEY}}, and the client CA bundle from the partners'
#                   CAs. There are no certs here and APISIX refuses to load a file
#                   with an unresolved ${{...}} placeholder, so the section is
#                   gone - and with it the 9443 HTTPS listener.
#   cert-auth:      needs that same client certificate chain. Replaced with
#                   key-auth, which produces the same 401/403 traffic without a PKI
#                   and leaves consumer-restriction working unchanged.
#   ip-restriction: the whitelist held the partners' public IPs, which rejects every
#                   request that can be made from this machine.
#   host:           routes matched a public test hostname, so every local call
#                   needed a Host header. Dropped - they match on path.
#   upstreams:      the partner systems were real HTTPS endpoints with client
#                   certs. They are now two local containers, one each, so the
#                   upstream_addr / upstream_host fields in the log format below
#                   still differ per route.
#
# Start the backends and the traffic generator with:
#   docker compose --profile test up -d
#
# APISIX re-reads this file about once a second, so saving it is enough. The `#END`
# marker at the bottom is required.

consumers:
  # One consumer per calling system, matched by the consumer-restriction
  # whitelists on the routes below.
  - username: "test-org-client-allowed"
    plugins:
      key-auth:
        key: test-org-key
  - username: "system-a-client-allowed"
    plugins:
      key-auth:
        key: system-a-key
  - username: "system-b-client-allowed"
    plugins:
      key-auth:
        key: system-b-key
  - username: "system-c-client-allowed"
    plugins:
      key-auth:
        key: system-c-key

routes:
  # ---- The three production-shaped routes ----------------------------------------
  - id: system-a-to-system-b-route
    name: system-a-to-system-b-route
    uri: /system-a/system-b/*
    upstream_id: system-b-sender
    plugins:
      key-auth: {}
      consumer-restriction:
        whitelist:
          - "system-a-client-allowed"
      proxy-rewrite:
        regex_uri:
          - "^/system-a/system-b/?(.*)"
          # Production rewrites to a fixed service path; /anything/ in front of it
          # makes the local backend answer 200 instead of 404 while keeping the
          # path visible in the logs.
          - "/anything/routing/service"

  - id: system-b-to-system-a-route
    name: system-b-to-system-a-route
    uri: /system-b/system-a/*
    upstream_id: system-a-sender
    plugins:
      key-auth: {}
      consumer-restriction:
        whitelist:
          - "system-b-client-allowed"
      proxy-rewrite:
        regex_uri:
          - "^/system-b/system-a/?(.*)"
          - "/anything/$1"

  - id: system-c-to-system-a-route
    name: system-c-to-system-a-route
    uri: /system-c/system-a/*
    upstream_id: system-a-sender
    plugins:
      key-auth: {}
      consumer-restriction:
        whitelist:
          - "system-c-client-allowed"
      proxy-rewrite:
        regex_uri:
          - "^/system-c/system-a/?(.*)"
          - "/anything/$1"

  # ---- Local only: knobs for producing specific metrics and log lines ----------
  # No auth on these, so the traffic generator can ask for an exact status code or
  # an exact upstream latency.
  - id: local-status
    name: local-status
    uri: /local/status/*
    upstream_id: system-a-sender
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/local/status/(.*)"
          - "/status/$1"

  - id: local-delay
    name: local-delay
    uri: /local/delay/*
    upstream_id: system-b-sender
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/local/delay/(.*)"
          - "/delay/$1"

upstreams:
  # Both are go-httpbin containers. Two of them rather than one shared instance so
  # $upstream_addr and $upstream_host differ per route in the logs.
  - name: system-b-sender
    id: system-b-sender
    desc: System B API (local mock)
    type: roundrobin
    scheme: http
    pass_host: node
    nodes:
      - host: "system-b-mock"
        port: 8080
        weight: 1

  - name: system-a-sender
    id: system-a-sender
    desc: System A API (local mock)
    type: roundrobin
    scheme: http
    pass_host: node
    nodes:
      - host: "system-a-mock"
        port: 8080
        weight: 1

global_rules:
  - id: 1
    plugins:
      # Worth knowing before you trust it: the `source` field it feeds is always
      # empty on this image. APISIX overwrites the X-Forwarded-For request header
      # before the log phase runs, so $http_x_forwarded_for resolves to nothing.
      # real-ip cannot compensate either: nginx only honours it for proxies listed
      # in real_ip_from, which here is 127.0.0.1 and unix: only. Add the docker
      # subnet to nginx_config.http.real_ip_from in config/apisix-config.yaml if you
      # want to exercise that path.
      real-ip:
        source: "$http_x_forwarded_for"

      # Without it APISIX exports no per-route metrics at all.
      prometheus: {}

      loki-logger:
        endpoint_addrs:
          - http://loki:3100
        # Ignored by the local Loki, which runs with auth_enabled: false.
        tenant_id: "local"
        log_labels:
          app_instance: "frank-gateway"
          service_name: "apisix"
          app_name: "apisix"
          container: "apisix"
          level: "INFO"
          # To use ${{POD_NAME}} / ${{NAMESPACE}} placeholders instead, set those on
          # the apisix service in docker-compose.yaml - APISIX interpolates ${{...}}
          # from its own environment.
          pod: "frank-gateway-local"
          instance: "local/frank-gateway-local:apisix"
          namespace: "local"
          log_type: "audit"
          # TODO: add error logs here
        # Flushes about a second after traffic stops instead of the 60s default, so
        # log lines show up in Grafana while you are still looking at them.
        batch_max_size: 20
        buffer_duration: 5
        inactive_timeout: 1
        log_format:
          level: "INFO"
          timestamp: "$time_iso8601"
          gemeente_code: "0000"
          route_name: "$route_name"
          source: "$http_x_forwarded_for"
          # Unlike `source` above, this one is always present.
          source_addr: "$remote_addr"
          request:
            request_method: "$request_method"
            request_path: "$uri"
            request_host: "$host"
          response:
            status: "$status"
            upstream_latency_ms: "$upstream_response_time"
            upstream_endpoint:
              scheme: "$upstream_scheme"
              host: "$upstream_host"
              uri: "$upstream_uri"
              query: "$args"
              address: "$upstream_addr"
          audit:
            route_id: "$route_id"
#END
